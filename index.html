 if(sb){const a=await sb.from('records').upsert({key:k,data:state[k],updated_by:U.n,updated_at:meta[k].at});if(a.error)toast('Sync failed: '+a.error.message);
  const b=await sb.from('audit_logs').insert(e).select().single();if(b.data)addLog(b.data);else if(b.error)toast('Audit failed: '+b.error.message)}
